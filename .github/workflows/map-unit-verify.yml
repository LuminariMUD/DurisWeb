name: Surface map unit test (temporary verification)
on:
  push:
    branches:
      - feature/illustrated-duris-surface-atlas
jobs:
  surface-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit-test map coordinates and illustrated source data
        run: pnpm test:unit --run src/utils/__tests__/surfaceMapCoordinates.spec.ts src/utils/__tests__/surfaceMapIllustration.spec.ts
