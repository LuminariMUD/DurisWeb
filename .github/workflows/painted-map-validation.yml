name: Painted Map Validation

on:
  pull_request:
    paths:
      - 'frontend/src/components/wiki/**'
      - 'frontend/src/utils/paintedMap/**'
      - 'frontend/src/views/wiki/WikiMapView.vue'
      - 'backend/src/routes/wiki.ts'
      - 'backend/src/services/wikiService.ts'
      - 'backend/src/services/__tests__/wikiMapSectors.test.ts'
      - '.github/workflows/painted-map-validation.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Run painted map and existing map regression tests
        run: >-
          pnpm --dir frontend test:unit --run
          src/components/wiki/__tests__/LeafletMap.spec.ts
          src/utils/paintedMap/__tests__/painter.spec.ts
          src/utils/paintedMap/__tests__/worldFeatures.spec.ts
          src/views/__tests__/SurfaceMapView.spec.ts
      - name: Production build (including module worker)
        run: pnpm --dir frontend build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Test read-only map sector and image services
        run: >-
          pnpm --dir backend test --runInBand
          src/services/__tests__/wikiMapSectors.test.ts
          src/services/__tests__/wikiMapImage.test.ts
      - name: Production build
        run: pnpm --dir backend build
