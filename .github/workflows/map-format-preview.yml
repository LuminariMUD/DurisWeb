name: Map formatter preview (no repository writes)
on:
  push:
    branches:
      - feature/illustrated-duris-surface-atlas
jobs:
  format-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Print formatted source without changing any files
        shell: bash
        run: |
          set -eu
          for path in src/views/SurfaceMapView.vue src/utils/surfaceMapIllustration.ts src/utils/__tests__/surfaceMapIllustration.spec.ts; do
            echo "FORMAT_BEGIN:$path"
            pnpm exec biome format --stdin-file-path="$path" < "$path" | base64 -w 0
            echo
            echo "FORMAT_END:$path"
          done
