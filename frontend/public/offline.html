<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - DurisWeb</title>
    <meta name="theme-color" content="#111310">
    <link rel="icon" href="/favicon.ico">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #111310;
        color: #d0cec2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
      }

      .icon {
        font-size: 64px;
        margin-bottom: 24px;
        opacity: 0.8;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: #ece8dd;
        margin-bottom: 12px;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: #b8b5a8;
        margin-bottom: 24px;
      }

      .retry-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: #b92e1c;
        color: #fff4e8;
        border: none;
        border-radius: 0;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .retry-btn:hover {
        background: #d03b26;
      }

      .retry-btn:active {
        transform: scale(0.98);
      }

      .cached-links {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #575743;
      }

      .cached-links h2 {
        font-size: 14px;
        font-weight: 600;
        color: #898879;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
      }

      .cached-links a {
        display: block;
        padding: 8px 16px;
        color: #df583d;
        text-decoration: none;
        border-radius: 0;
        transition: background 0.2s;
      }

      .cached-links a:hover {
        background: rgba(223, 88, 61, 0.12);
      }

      .status {
        margin-top: 24px;
        font-size: 12px;
        color: #898879;
      }

      .status.online {
        color: #8aa66b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>you're offline</h1>
      <p>
        it looks like you've lost your internet connection.
        some cached content may still be available below.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        <span>↻</span>
        try again
      </button>

      <div class="cached-links">
        <h2>cached pages</h2>
        <a href="/">home</a>
        <a href="/news">news</a>
        <a href="/pvp">pvp logs</a>
        <a href="/forum">forum</a>
      </div>

      <div class="status" id="status">
        checking connection...
      </div>
    </div>

    <script>
      // check connection status
      function updateStatus() {
        const statusEl = document.getElementById('status');
        if (navigator.onLine) {
          statusEl.textContent = 'connection restored! refreshing...';
          statusEl.classList.add('online');
          setTimeout(() => window.location.reload(), 1000);
        } else {
          statusEl.textContent = 'still offline';
          statusEl.classList.remove('online');
        }
      }

      // listen for connection changes
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);

      // initial check
      updateStatus();
    </script>
  </body>
</html>
