server {
    listen @NGINX_HTTP_LISTEN@;
    server_name @NGINX_SERVER_NAMES@;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen @NGINX_HTTPS_LISTEN@ ssl http2;
    server_name @NGINX_SERVER_NAMES@;

    ssl_certificate @NGINX_TLS_CERTIFICATE@;
    ssl_certificate_key @NGINX_TLS_CERTIFICATE_KEY@;
    include @NGINX_TLS_OPTIONS_INCLUDE@;
    ssl_dhparam @NGINX_TLS_DHPARAM@;

    root @FRONTEND_DIST@;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location = /kofihook {
        proxy_pass @NGINX_BACKEND_UPSTREAM@/kofihook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 64k;
    }

    location /api {
        proxy_pass @NGINX_BACKEND_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass @NGINX_BACKEND_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io {
        proxy_pass @NGINX_BACKEND_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
