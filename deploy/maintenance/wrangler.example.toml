# Copy outside the repository; replace every path/host/zone placeholder before deploying.
name = "durisweb-maintenance"
main = "/absolute/path/to/durisweb/deploy/maintenance/worker.mjs"
compatibility_date = "2026-09-05"
workers_dev = false
preview_urls = false
keep_vars = true

# Routes, not Custom Domains. Keep the existing proxied tunnel DNS records.
# Include every configured public website/API hostname, including website aliases.
# Add a separate API/web-socket hostname when configured; omit hosts not used by the website.
# Never match the MUD hostname or the whole zone.
routes = [
  { pattern = "website.example.invalid/*", zone_name = "example.invalid" },
  { pattern = "www.website.example.invalid/*", zone_name = "example.invalid" },
]

# MAINTENANCE_REASON is an operator-owned dashboard variable, deliberately not in [vars].
# Accepted values: off (default), maintenance, mud_burnin.
# keep_vars preserves this setting across code deployments.
